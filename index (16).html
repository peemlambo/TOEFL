<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOEFL iBT 2026 — Full Mock Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#7A0C1E; --navy-2:#570815; --gold:#6E6E6E; --gold-2:#4D4D4D;
  --bg:#f5f5f5; --panel:#ffffff; --ink:#232323; --sub:#6b6b6b; --line:#dcdcdc;
  --good:#2e7d4f; --bad:#b3392c; --shadow: 0 8px 24px rgba(122,12,30,.10);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1a1414; --panel:#241c1c; --ink:#f0eceb; --sub:#b9b0af; --line:#3a2f2f;
    --navy:#b3324a; --gold:#a8a8a8; --shadow: 0 8px 24px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#1a1414; --panel:#241c1c; --ink:#f0eceb; --sub:#b9b0af; --line:#3a2f2f;
  --navy:#b3324a; --gold:#a8a8a8; --shadow: 0 8px 24px rgba(0,0,0,.4);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--ink);
  font-family:'IBM Plex Sans',system-ui,sans-serif;
  min-height:100vh;
}
.topbar{
  background:var(--navy); color:#fff; padding:14px 20px;
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  position:sticky; top:0; z-index:50; box-shadow:var(--shadow);
}
.topbar .brand{display:flex; align-items:center; gap:10px; font-weight:700; letter-spacing:.2px;}
.topbar .brand .badge{
  background:var(--gold); color:var(--navy-2); font-size:11px; font-weight:700;
  padding:3px 8px; border-radius:20px; text-transform:uppercase; letter-spacing:.5px;
}
.topbar .mid{font-size:13px; opacity:.9; text-align:center; flex:1;}
.timer{
  font-variant-numeric:tabular-nums; background:rgba(255,255,255,.12);
  padding:6px 12px; border-radius:8px; font-weight:600; font-size:14px; min-width:70px; text-align:center;
}
.timer.low{background:var(--bad); animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.6;}}
.themebtn{background:transparent; border:1px solid rgba(255,255,255,.4); color:#fff; border-radius:6px; padding:5px 9px; cursor:pointer; font-size:12px;}
.progress-wrap{background:var(--panel); border-bottom:1px solid var(--line); padding:8px 20px;}
.progress-track{height:6px; background:var(--line); border-radius:4px; overflow:hidden;}
.progress-fill{height:100%; background:linear-gradient(90deg,var(--gold),var(--navy)); transition:width .4s ease;}
.progress-label{font-size:12px; color:var(--sub); margin-top:6px; display:flex; justify-content:space-between;}
main{max-width:880px; margin:0 auto; padding:28px 20px 100px;}
.card{
  background:var(--panel); border:1px solid var(--line); border-radius:14px;
  padding:28px 30px; box-shadow:var(--shadow); margin-bottom:20px;
}
h1.hero{font-family:'Source Serif 4',serif; font-size:30px; color:var(--navy); margin:0 0 8px;}
:root[data-theme="dark"] h1.hero, @media (prefers-color-scheme:dark){h1.hero{color:var(--gold);}}
h2.section-title{
  font-family:'Source Serif 4',serif; font-size:22px; color:var(--navy); margin:0 0 4px;
}
.eyebrow{
  text-transform:uppercase; letter-spacing:1px; font-size:11px; font-weight:700; color:var(--gold-2);
  margin-bottom:6px; display:block;
}
.sub{color:var(--sub); font-size:14px; margin:0 0 18px; line-height:1.5;}
p.lead{color:var(--sub); line-height:1.6;}
.passage{
  font-family:'Source Serif 4',serif; font-size:17px; line-height:1.75; color:var(--ink);
  background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:20px 22px; margin:14px 0;
}
.passage blank{
  display:inline-block; border-bottom:2px solid var(--gold-2); min-width:70px; text-align:center; font-weight:600;
}
.qblock{margin:22px 0; padding-top:18px; border-top:1px dashed var(--line);}
.qblock:first-child{border-top:none; padding-top:0;}
.qnum{font-weight:700; color:var(--navy); margin-bottom:8px;}
:root[data-theme="dark"] .qnum, @media (prefers-color-scheme:dark){.qnum{color:var(--gold);}}
.qtext{margin-bottom:12px; line-height:1.55;}
.opt{
  display:flex; align-items:flex-start; gap:10px; padding:11px 14px; border:1px solid var(--line);
  border-radius:9px; margin-bottom:9px; cursor:pointer; transition:.15s; background:var(--panel);
}
.opt:hover{border-color:var(--gold);}
.opt.selected{border-color:var(--navy); background:rgba(31,56,100,.06); font-weight:600;}
:root[data-theme="dark"] .opt.selected, @media (prefers-color-scheme:dark){.opt.selected{background:rgba(211,172,118,.1); border-color:var(--gold);}}
.opt input{margin-top:3px;}
input[type=text].blankinput{
  border:none; border-bottom:2px solid var(--gold-2); background:transparent; font-family:'Source Serif 4',serif;
  font-size:16px; color:var(--ink); width:110px; padding:2px 4px; outline:none; text-align:center;
}
textarea{
  width:100%; min-height:160px; border:1px solid var(--line); border-radius:10px; padding:14px;
  font-family:'IBM Plex Sans',sans-serif; font-size:15px; line-height:1.6; resize:vertical; background:var(--panel); color:var(--ink);
}
.audio-panel{
  display:flex; align-items:center; gap:14px; background:var(--bg); border:1px solid var(--line);
  border-radius:10px; padding:16px 18px; margin:14px 0;
}
.audio-panel .icon{font-size:26px;}
.audio-panel .info{flex:1;}
.audio-panel .info b{display:block; margin-bottom:2px;}
.audio-panel .info span{font-size:13px; color:var(--sub);}
button{
  font-family:'IBM Plex Sans',sans-serif; font-weight:600; font-size:14px; cursor:pointer;
  border-radius:9px; padding:11px 20px; border:none; transition:.15s;
}
.btn-primary{background:var(--navy); color:#fff;}
.btn-primary:hover{background:var(--navy-2);}
.btn-primary:disabled{opacity:.45; cursor:not-allowed;}
.btn-gold{background:var(--gold); color:var(--navy-2);}
.btn-gold:hover{background:var(--gold-2); color:#fff;}
.btn-ghost{background:transparent; border:1px solid var(--line); color:var(--ink);}
.btn-ghost:hover{border-color:var(--navy);}
.btn-danger{background:var(--bad); color:#fff;}
.footer-nav{
  position:sticky; bottom:0; background:var(--panel); border-top:1px solid var(--line);
  padding:14px 20px; display:flex; justify-content:space-between; gap:10px; max-width:880px; margin:0 auto;
  box-shadow:0 -6px 20px rgba(0,0,0,.05);
}
.rec-indicator{display:flex; align-items:center; gap:8px; font-size:14px; color:var(--bad); font-weight:600;}
.rec-dot{width:10px; height:10px; border-radius:50%; background:var(--bad); animation:pulse .8s infinite;}
.tag{display:inline-block; font-size:11px; font-weight:700; padding:3px 9px; border-radius:20px; text-transform:uppercase; letter-spacing:.4px;}
.tag.hard{background:#f4d6d1; color:#8a2e20;}
.tag.easy{background:#d7ecd9; color:#1f6b34;}
:root[data-theme="dark"] .tag.hard, @media(prefers-color-scheme:dark){.tag.hard{background:#4a2620; color:#f4b9ae;}}
:root[data-theme="dark"] .tag.easy, @media(prefers-color-scheme:dark){.tag.easy{background:#1e3a24; color:#a9dbb3;}}
.scorecard{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin:18px 0;}
.scorebox{background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:16px; text-align:center;}
.scorebox .n{font-size:28px; font-weight:700; color:var(--navy);}
:root[data-theme="dark"] .scorebox .n, @media(prefers-color-scheme:dark){.scorebox .n{color:var(--gold);}}
.scorebox .l{font-size:12px; color:var(--sub); text-transform:uppercase; letter-spacing:.5px;}
.center{text-align:center;}
.mini{font-size:12px; color:var(--sub);}
.wordbank{display:flex; flex-wrap:wrap; gap:8px; margin:14px 0;}
.chip{
  background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:8px 14px; cursor:pointer;
  font-family:'Source Serif 4',serif; font-size:15px; user-select:none;
}
.chip.used{opacity:.35; cursor:default;}
.sentence-slot{
  min-height:52px; border:2px dashed var(--line); border-radius:10px; padding:10px; display:flex; flex-wrap:wrap;
  gap:8px; align-items:center; margin-bottom:10px; background:var(--bg);
}
.sentence-slot .chip{background:var(--panel); border-color:var(--gold-2);}
ul.disc-thread{list-style:none; padding:0; margin:14px 0;}
ul.disc-thread li{
  background:var(--bg); border-left:3px solid var(--gold-2); border-radius:0 8px 8px 0;
  padding:12px 16px; margin-bottom:10px;
}
ul.disc-thread li b{color:var(--navy);}
:root[data-theme="dark"] ul.disc-thread li b, @media(prefers-color-scheme:dark){ul.disc-thread li b{color:var(--gold);}}
.hidden{display:none !important;}
.welcome-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin:20px 0;}
.welcome-grid .wcard{background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:14px; text-align:center;}
.welcome-grid .wcard .t{font-weight:700; color:var(--navy); font-size:13px;}
:root[data-theme="dark"] .welcome-grid .wcard .t, @media(prefers-color-scheme:dark){.welcome-grid .wcard .t{color:var(--gold);}}
.welcome-grid .wcard .m{font-size:12px; color:var(--sub); margin-top:3px;}
@media (max-width:640px){.welcome-grid{grid-template-columns:1fr 1fr;} .card{padding:20px 18px;}}
.wordcount{font-size:12px; color:var(--sub); text-align:right; margin-top:6px;}
.interview-q{font-family:'Source Serif 4',serif; font-size:20px; text-align:center; padding:30px 10px; color:var(--navy);}
:root[data-theme="dark"] .interview-q, @media(prefers-color-scheme:dark){.interview-q{color:var(--gold);}}
</style>
</head>

<main id="app"></main>

<div class="footer-nav" id="footerNav" style="display:none;">

  <button class="btn-primary" id="nextBtn">Next →</button>
</div>

/* ============================= TTS ENGINE ============================= */
function speakLines(text, onend){
  window.speechSynthesis.cancel();
  const lines = Array.isArray(text) ? text : [text];
  let i = 0;
  function next(){
    if(i >= lines.length){ if(onend) onend(); return; }
    const u = new SpeechSynthesisUtterance(lines[i]);
    u.rate = 0.98; u.pitch = 1; u.lang = 'en-US';
    u.onend = ()=>{ i++; next(); };
    u.onerror = ()=>{ i++; next(); };
    window.speechSynthesis.speak(u);
  }
  next();
}
function stopSpeaking(){ window.speechSynthesis.cancel(); }

/* ============================= MIC RECORDING ============================= */
async function startRecording(onData){
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    state.recStream = stream;
    const chunks = [];
    const mr = new MediaRecorder(stream);
    mr.ondataavailable = e => { if(e.data.size>0) chunks.push(e.data); };
    mr.onstop = ()=>{
      const blob = new Blob(chunks, {type:'audio/webm'});
      stream.getTracks().forEach(t=>t.stop());
      if(onData) onData(blob);
    };
    mr.start();
    state.mediaRecorder = mr;
    return true;
  }catch(err){
    console.warn('Mic unavailable', err);
    return false;
  }
}
function stopRecording(){
  if(state.mediaRecorder && state.mediaRecorder.state !== 'inactive'){
    state.mediaRecorder.stop();
  }
}

/* ============================= TIMER ============================= */
function startCountdown(seconds, onTick, onDone){
  clearInterval(state.timerId);
  state.timeLeft = seconds;
  updateTimerDisplay();
  state.timerId = setInterval(()=>{
    state.timeLeft--;
    updateTimerDisplay();
    if(onTick) onTick(state.timeLeft);
    if(state.timeLeft <= 0){
      clearInterval(state.timerId);
      if(onDone) onDone();
    }
  },1000);
}
function stopCountdown(){ clearInterval(state.timerId); document.getElementById('timerDisplay').textContent = '—:—'; document.getElementById('timerDisplay').classList.remove('low'); }
function updateTimerDisplay(){
  const el = document.getElementById('timerDisplay');
  const m = Math.floor(state.timeLeft/60), s = state.timeLeft%60;
  el.textContent = `${m}:${s.toString().padStart(2,'0')}`;
  el.classList.toggle('low', state.timeLeft <= 30 && state.timeLeft > 0);
}

/* ============================= DOWNLOAD HELPER ============================= */
async function saveFile(filename, content, mime){
  try{
    if(window.claude && window.claude.downloadFile){
      await window.claude.downloadFile(filename, content, mime);
      return true;
    }
  }catch(e){ console.warn('downloads capability unavailable', e); }
  try{
    const blob = content instanceof Blob ? content : new Blob([content], {type:mime||'text/plain'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    return true;
  }catch(e){ console.error('manual download failed', e); return false; }
}

const GROUP_DURATIONS = { reading: 27*60, listening: 27*60, writingEmail: 7*60, writingDiscussion: 10*60 };
const PHASE_GROUP = {
  'reading-m1':'reading', 'reading-branch-gate':'reading', 'reading-m2':'reading',
  'listening-m1':'listening', 'listening-branch-gate':'listening', 'listening-m2':'listening',
  'writing-email':'writingEmail', 'writing-discussion':'writingDiscussion'
};
function syncGroupTimer(phase){
  const group = PHASE_GROUP[phase] || null;
  if(group === state.timerGroup) return; // same section — let the running countdown keep going
  stopCountdown();
  state.timerGroup = group;
  if(group && GROUP_DURATIONS[group]){
    startCountdown(GROUP_DURATIONS[group], null, null);
  }
}

/* ============================= MAIN STEP RENDERER ============================= */
function renderStep(){
  stopSpeaking();
  const step = state.sequence[state.idx];
  const pct = (state.idx/(state.sequence.length-1))*100;
  window.scrollTo({top:0, behavior:'instant'});
  if(!step){ return; }
  syncGroupTimer(step.phase);

  if(step.phase === 'reading-m1'){ setSectionLabel('Reading — Module 1'); setProgress(`Reading Module 1 — Item ${CONTENT.readingM1.indexOf(step.item)+1} of ${CONTENT.readingM1.length}`, pct); renderPassageTask(step.item, 'reading'); return; }
  if(step.phase === 'reading-branch-gate'){ scoreReadingM1(); renderBranchGate('Reading', state.readingBranch); return; }
  if(step.phase === 'reading-m2'){ const item = state.readingBranch==='hard' ? CONTENT.readingM2Hard : CONTENT.readingM2Easy; setSectionLabel('Reading — Module 2'); setProgress('Reading Module 2', pct); renderPassageTask(item, 'reading'); return; }

  if(step.phase === 'listening-m1'){ setSectionLabel('Listening — Module 1'); setProgress(`Listening Module 1 — Item ${CONTENT.listeningM1.indexOf(step.item)+1} of ${CONTENT.listeningM1.length}`, pct); renderListenTask(step.item); return; }
  if(step.phase === 'listening-branch-gate'){ scoreListeningM1(); renderBranchGate('Listening', state.listeningBranch); return; }
  if(step.phase === 'listening-m2'){ const item = state.listeningBranch==='hard' ? CONTENT.listeningM2Hard : CONTENT.listeningM2Easy; setSectionLabel('Listening — Module 2'); setProgress('Listening Module 2', pct); renderListenTask(item); return; }

  if(step.phase === 'speaking-repeat'){ setSectionLabel('Speaking — Listen and Repeat'); setProgress('Speaking Task 1', pct); renderListenRepeat(); return; }
  if(step.phase === 'speaking-interview'){ setSectionLabel('Speaking — Take an Interview'); setProgress('Speaking Task 2', pct); renderInterview(); return; }

  if(step.phase === 'writing-sentence'){ setSectionLabel('Writing — Build a Sentence'); setProgress('Writing Task 1', pct); renderBuildSentence(); return; }
  if(step.phase === 'writing-email'){ setSectionLabel('Writing — Write an Email'); setProgress('Writing Task 2', pct); renderEmailTask(); return; }
  if(step.phase === 'writing-discussion'){ setSectionLabel('Writing — Academic Discussion'); setProgress('Writing Task 3', pct); renderDiscussionTask(); return; }

  if(step.phase === 'results'){ setSectionLabel('Test Complete'); setProgress('Complete', 100); renderResults(); return; }
}

/* ============================= READING / GENERIC PASSAGE ============================= */
function renderPassageTask(item, kind){
  footerCenter.innerHTML = '';
  prevBtn.style.visibility = state.idx===0 ? 'hidden' : 'visible';
  nextBtn.textContent = 'Next →'; nextBtn.disabled = false;

  const c = el('div','card');
  let head = `<span class="eyebrow">${item.eyebrow}</span>`;
  if(item.tag) head += ` <span class="tag ${item.tag}">${item.tag==='hard'?'Higher Level':'Standard Level'}</span>`;
  head += `<h2 class="section-title">${item.title}</h2><p class="sub">${item.instructions}</p>`;
  c.innerHTML = head;

  const passageDiv = el('div','passage');
  item.passage.forEach((p,i)=>{
    const para = el('p'); para.style.margin = i===0 ? '0 0 10px' : '0 0 12px';
    if(i===0 && item.passage.length>1 && item.type!=='complete-words'){ para.style.fontWeight='700'; para.style.fontFamily="'Source Serif 4',serif"; para.style.fontSize='19px'; }
    para.textContent = p;
    passageDiv.appendChild(para);
  });
  c.appendChild(passageDiv);

  if(item.type === 'complete-words'){
    // Replace ___-marked words? Our text has partial letters directly (e.g. rese_rch). Build inputs.
    passageDiv.innerHTML = '';
    let blankIdx = 0;
    item.passage.forEach((para, pi)=>{
      const p = el('p'); p.style.margin = '0 0 12px';
      const parts = para.split(/(\S*_\S*)/g);
      parts.forEach(part=>{
        if(part.includes('_')){
          const wrap = document.createTextNode('');
          const input = document.createElement('input');
          input.type = 'text'; input.className='blankinput';
          input.dataset.blankIndex = blankIdx;
          input.placeholder = part.replace(/_/g,'•');
          input.value = state.answers[item.id+'_b'+blankIdx] || '';
          input.oninput = ()=>{ state.answers[item.id+'_b'+blankIdx] = input.value; };
          blankIdx++;
          p.appendChild(document.createTextNode(' '));
          p.appendChild(input);
          p.appendChild(document.createTextNode(' '));
        } else if(part) {
          p.appendChild(document.createTextNode(part));
        }
      });
      passageDiv.appendChild(p);
    });
  } else {
    item.questions.forEach((q, qi)=>{
      const qb = el('div','qblock');
      qb.innerHTML = `<div class="qnum">Question ${qi+1}</div><div class="qtext">${q.q}</div>`;
      const optsWrap = el('div');
      q.opts.forEach((opt, oi)=>{
        const o = el('label','opt');
        const key = item.id+'_q'+qi;
        const checked = state.answers[key] === oi ? 'checked' : '';
        if(state.answers[key]===oi) o.classList.add('selected');
        o.innerHTML = `<input type="radio" name="${key}" value="${oi}" ${checked}><span>${opt}</span>`;
        o.querySelector('input').onchange = ()=>{
          state.answers[key] = oi;
          [...optsWrap.children].forEach(x=>x.classList.remove('selected'));
          o.classList.add('selected');
        };
        optsWrap.appendChild(o);
      });
      qb.appendChild(optsWrap);
      c.appendChild(qb);
    });
  }

  app.innerHTML = ''; app.appendChild(c);
}

/* ============================= SCORING ============================= */
function scoreReadingM1(){
  let correct = 0, total = 0;
  ['r2','r3'].forEach(id=>{
    const item = CONTENT.readingM1.find(x=>x.id===id);
    const key = ANSWER_KEYS[id];
    item.questions.forEach((q,qi)=>{
      total++;
      if(state.answers[id+'_q'+qi] === key[qi]) correct++;
    });
  });
  state.readingM1Score = correct; state.readingM1Total = total;
  state.readingBranch = (correct/total) >= 0.7 ? 'hard' : 'easy';
}
function scoreListeningM1(){
  let correct = 0, total = 0;
  CONTENT.listeningM1.forEach(item=>{
    const key = ANSWER_KEYS[item.id];
    item.questions.forEach((q,qi)=>{
      total++;
      if(state.answers[item.id+'_q'+qi] === key[qi]) correct++;
    });
  });
  state.listeningM1Score = correct; state.listeningM1Total = total;
  state.listeningBranch = (correct/total) >= 0.7 ? 'hard' : 'easy';
}

      const optsWrap = el('div');
      q.opts.forEach((opt, oi)=>{
        const o = el('label','opt');
        const key = item.id+'_q'+qi;
        const checked = state.answers[key] === oi ? 'checked' : '';
        if(state.answers[key]===oi) o.classList.add('selected');
        o.innerHTML = `<input type="radio" name="${key}" value="${oi}" ${checked}><span>${opt}</span>`;
        o.querySelector('input').onchange = ()=>{
          state.answers[key] = oi;
          [...optsWrap.children].forEach(x=>x.classList.remove('selected'));
          o.classList.add('selected');
        };
        optsWrap.appendChild(o);
      });
      qb.appendChild(optsWrap);
      qArea.appendChild(qb);
    });
  }
  c.appendChild(qArea);
  app.innerHTML = ''; app.appendChild(c);

  document.getElementById('playBtn').onclick = ()=>{
    document.getElementById('playBtn').disabled = true;
    document.getElementById('playBtn').textContent = '▶ Playing…';
    speakLines(item.script.split('\n'), ()=>{
      state.audioPlayed[item.id] = true;
      renderListenTask(item);
    });
  };
}

/* ============================= SPEAKING: LISTEN AND REPEAT ============================= */
function renderListenRepeat(){
  footerCenter.innerHTML = '';
  prevBtn.style.visibility='visible';
  const data = CONTENT.speaking.listenRepeat;
  if(state.repeatIdx === undefined) state.repeatIdx = 0;
  const i = state.repeatIdx;
  const done = i >= data.items.length;
  nextBtn.textContent = done ? 'Next →' : 'Skip Item';
  nextBtn.disabled = false;

  const c = el('div','card');
  c.innerHTML = `<span class="eyebrow">${data.eyebrow}</span><h2 class="section-title">${data.title}</h2><p class="sub">${data.instructions}</p>`;

  if(done){
    c.innerHTML += `<p class="lead center" style="padding:20px 0;">✓ All ${data.items.length} items complete. Click Next to continue to the interview task.</p>`;
    app.innerHTML=''; app.appendChild(c);
    nextBtn.onclick = ()=>{ delete state.repeatIdx; goNext(); };
    return;
  }

  const body = el('div');
  body.innerHTML = `<p class="mini">Item ${i+1} of ${data.items.length}</p>`;
  const audioPanel = el('div','audio-panel');
  const recorded = !!state.recordings['repeat_'+i];
  audioPanel.innerHTML = `
    <div class="icon">🎧</div>
    <div class="info"><b id="repeatStatus">Click play to hear the sentence</b><span>Then record yourself repeating it.</span></div>
    <button class="btn-gold" id="repeatPlayBtn">▶ Play</button>
  `;
  body.appendChild(audioPanel);

  const recPanel = el('div','audio-panel');
  recPanel.innerHTML = `
    <div class="icon">🎙️</div>
    <div class="info"><b id="recStatus">${recorded ? 'Response recorded' : 'Not yet recorded'}</b><span id="recSub">Recording starts automatically after the audio finishes.</span></div>
    <div id="recControls"></div>
  `;
  body.appendChild(recPanel);
  c.appendChild(body);
  app.innerHTML=''; app.appendChild(c);

  document.getElementById('repeatPlayBtn').onclick = ()=>{
    const btn = document.getElementById('repeatPlayBtn');
    btn.disabled = true; document.getElementById('repeatStatus').textContent = 'Playing…';
    speakLines(data.items[i], async ()=>{
      document.getElementById('repeatStatus').textContent = 'Now recording your response…';
      const ok = await startRecording(blob=>{
        state.recordings['repeat_'+i] = blob;
        document.getElementById('recStatus').textContent = 'Response recorded ✓';
        document.getElementById('recSub').textContent = 'You can move to the next item.';
      });
      if(!ok){
        document.getElementById('recSub').textContent = 'Microphone unavailable — skipping recording for this item.';
        return;
      }
      startCountdown(4, (t)=>{
        const sub = document.getElementById('recSub');
        if(sub) sub.innerHTML = `<span class="rec-indicator"><span class="rec-dot"></span>Recording — ${t}s left</span>`;
      }, ()=>{ stopRecording(); });
      const sub0 = document.getElementById('recSub');
      if(sub0) sub0.innerHTML = '<span class="rec-indicator"><span class="rec-dot"></span>Recording — 4s left</span>';
    });
  };

  nextBtn.onclick = ()=>{
    stopSpeaking(); stopRecording(); stopCountdown();
    state.repeatIdx++;
    renderListenRepeat();
  };
}

/* ============================= SPEAKING: INTERVIEW ============================= */
function renderInterview(){
  footerCenter.innerHTML = '';
  prevBtn.style.visibility='visible';
  const data = CONTENT.speaking.interview;
  if(state.interviewIdx === undefined) state.interviewIdx = 0;
  const i = state.interviewIdx;
  const done = i >= data.questions.length;
  nextBtn.textContent = done ? 'Continue to Writing →' : 'Skip Question';

  const c = el('div','card');
  c.innerHTML = `<span class="eyebrow">${data.eyebrow}</span><h2 class="section-title">${data.title} — ${data.tag2}</h2><p class="sub">${data.instructions}</p>`;

  if(done){
    c.innerHTML += `<p class="lead center" style="padding:20px 0;">✓ All 4 interview questions complete.</p>`;
    app.innerHTML=''; app.appendChild(c);
    nextBtn.onclick = ()=>{ goNext(); };
    return;
  }

  c.innerHTML += `<p class="mini">Question ${i+1} of ${data.questions.length}</p><div class="interview-q" id="interviewQ">Press play to hear the question</div>`;
  const recPanel = el('div','audio-panel');
  recPanel.innerHTML = `
    <div class="icon">🎙️</div>
    <div class="info"><b id="ivStatus">Not started</b><span id="ivSub">No preparation time — recording begins the instant the question ends.</span></div>
    <button class="btn-gold" id="ivPlayBtn">▶ Play Question</button>
  `;
  c.appendChild(recPanel);
  app.innerHTML=''; app.appendChild(c);

  document.getElementById('ivPlayBtn').onclick = ()=>{
    const btn = document.getElementById('ivPlayBtn');
    btn.disabled = true;
    document.getElementById('interviewQ').textContent = '🔊 Playing question…';
    speakLines(data.questions[i], async ()=>{
      document.getElementById('interviewQ').textContent = '"'+data.questions[i]+'"';
      document.getElementById('ivStatus').textContent = 'Recording now — 45 seconds';
      document.getElementById('ivSub').innerHTML = '<span class="rec-indicator"><span class="rec-dot"></span>Recording your response…</span>';
      const ok = await startRecording(blob=>{
        state.recordings['interview_'+i] = blob;
        document.getElementById('ivStatus').textContent = 'Response recorded ✓';
        document.getElementById('ivSub').textContent = 'Click Skip Question to continue.';
      });
      if(!ok){
        document.getElementById('ivStatus').textContent = 'Microphone unavailable';
        document.getElementById('ivSub').textContent = 'Skipping recording for this item.';
        return;
      }
      startCountdown(45, null, ()=>{ stopRecording(); });
    });
  };

  nextBtn.onclick = ()=>{
    stopSpeaking(); stopRecording(); stopCountdown();
    state.interviewIdx++;
    renderInterview();
  };
}

/* ============================= WRITING: BUILD A SENTENCE ============================= */
function renderBuildSentence(){
  footerCenter.innerHTML = '';
  prevBtn.style.visibility='visible'; nextBtn.textContent='Next →'; nextBtn.disabled=false;
  const data = CONTENT.writing.buildSentence;
  if(!state.sentenceOrder) state.sentenceOrder = [];

  const c = el('div','card');
  c.innerHTML = `<span class="eyebrow">${data.eyebrow}</span><h2 class="section-title">${data.title}</h2><p class="sub">${data.instructions}</p>`;

  const slot = el('div','sentence-slot'); slot.id='sentSlot';
  const bank = el('div','wordbank'); bank.id='sentBank';

  function renderChips(){
    slot.innerHTML=''; bank.innerHTML='';
    state.sentenceOrder.forEach(ci=>{
      const chip = el('div','chip', data.chips[ci]);
      chip.onclick = ()=>{ state.sentenceOrder = state.sentenceOrder.filter(x=>x!==ci); renderChips(); };
      slot.appendChild(chip);
    });
    data.chips.forEach((text, ci)=>{
      const used = state.sentenceOrder.includes(ci);
      const chip = el('div','chip'+(used?' used':''), text);
      if(!used) chip.onclick = ()=>{ state.sentenceOrder.push(ci); renderChips(); };
      bank.appendChild(chip);
    });
  }
  renderChips();
  c.appendChild(el('p','mini','Your sentence:'));
  c.appendChild(slot);
  c.appendChild(el('p','mini','Available word groups:'));
  c.appendChild(bank);
  app.innerHTML=''; app.appendChild(c);
}

/* ============================= WRITING: EMAIL ============================= */
function renderEmailTask(){
  footerCenter.innerHTML = '';
  prevBtn.style.visibility='visible'; nextBtn.textContent='Next →'; nextBtn.disabled=false;
  const data = CONTENT.writing.email;
  const c = el('div','card');
  c.innerHTML = `<span class="eyebrow">${data.eyebrow}</span><h2 class="section-title">${data.title}</h2>
    <p class="lead" style="background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:16px;">${data.prompt}</p>
    <p class="mini">Suggested time: ${data.timeMin} minutes · Aim for at least ${data.minWords} words.</p>`;
  const ta = el('textarea'); ta.id='emailArea'; ta.placeholder='Dear Professor …';
  ta.value = state.answers.emailText || '';
  const wc = el('div','wordcount'); wc.id='emailWC';
  function updateWC(){ const n = ta.value.trim().split(/\s+/).filter(Boolean).length; wc.textContent = n + ' words'; state.answers.emailText = ta.value; }
  ta.oninput = updateWC;
  c.appendChild(ta); c.appendChild(wc); updateWC();
  app.innerHTML=''; app.appendChild(c);
}

/* ============================= WRITING: DISCUSSION ============================= */
function renderDiscussionTask(){
  footerCenter.innerHTML = '';
  prevBtn.style.visibility='visible'; nextBtn.textContent='Finish Test →'; nextBtn.disabled=false;
  const data = CONTENT.writing.discussion;
  const c = el('div','card');
  c.innerHTML = `<span class="eyebrow">${data.eyebrow}</span><h2 class="section-title">${data.title}</h2><p class="sub">${data.prompt}</p>
    <div class="passage"><b>Professor:</b> ${data.profQuestion}</div>`;
  const thread = el('ul','disc-thread');
  data.classmates.forEach(cm=>{ thread.innerHTML += `<li><b>${cm.name}:</b> ${cm.text}</li>`; });
  c.appendChild(thread);
  c.appendChild(el('p','mini',`Suggested time: ${data.timeMin} minutes · Aim for at least ${data.minWords} words.`));
  const ta = el('textarea'); ta.id='discArea'; ta.placeholder='Your response…';
  ta.value = state.answers.discText || '';
  const wc = el('div','wordcount');
  function updateWC(){ const n = ta.value.trim().split(/\s+/).filter(Boolean).length; wc.textContent = n + ' words'; state.answers.discText = ta.value; }
  ta.oninput = updateWC;
  c.appendChild(ta); c.appendChild(wc); updateWC();
  app.innerHTML=''; app.appendChild(c);
}

/* ============================= RESULTS ============================= */
function renderResults(){
  footerNav.style.display = 'none';
  stopSpeaking(); stopCountdown();
  const c = el('div','card');
  const readingPct = Math.round((state.readingM1Score/state.readingM1Total)*100);
  const listeningPct = Math.round((state.listeningM1Score/state.listeningM1Total)*100);
  const recCount = Object.keys(state.recordings).length;
  c.innerHTML = `
    <span class="eyebrow">Test Complete</span>
    <h1 class="hero">Nice work — you finished the full mock test.</h1>
    <p class="lead">Here's a summary of your Module 1 performance and your responses. This is a practice-scoring summary for Module 1 selected-response items only — Speaking and Writing responses (and Module 2) require instructor or AI-assisted review, matching how the real TOEFL iBT scores those sections.</p>
    <div class="scorecard">
      <div class="scorebox"><div class="n">${state.readingM1Score}/${state.readingM1Total}</div><div class="l">Reading M1 (${readingPct}%) → ${state.readingBranch==='hard'?'Higher':'Standard'}</div></div>
      <div class="scorebox"><div class="n">${state.listeningM1Score}/${state.listeningM1Total}</div><div class="l">Listening M1 (${listeningPct}%) → ${state.listeningBranch==='hard'?'Higher':'Standard'}</div></div>
    </div>
    <div class="scorecard">
      <div class="scorebox"><div class="n">${recCount}</div><div class="l">Speaking Recordings Captured</div></div>
      <div class="scorebox"><div class="n">${(state.answers.emailText||'').trim().split(/\s+/).filter(Boolean).length} / ${(state.answers.discText||'').trim().split(/\s+/).filter(Boolean).length}</div><div class="l">Email / Discussion Word Counts</div></div>
    </div>
    <div class="center" style="display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:22px;">
      <button class="btn-primary" id="dlReportBtn">⬇ Save Full Report (.txt)</button>
      <button class="btn-gold" id="dlRecordingsBtn">⬇ Save Recordings</button>
      <button class="btn-ghost" id="restartBtn">↺ Restart Test</button>
    </div>
    <p class="mini center" style="margin-top:16px;">Nothing here is uploaded anywhere — files save directly to your own device.</p>

    <div style="border-top:1px solid var(--line); margin-top:26px; padding-top:22px;">
      <h2 class="section-title" style="font-size:19px;">Send results to your teacher</h2>
      <p class="sub">This page has no server, so it can't send email or attach files on its own — a webpage is never allowed to email files silently, for your own security. Instead: enter the teacher's email, click the button below to download everything, and it opens a ready-made email draft in your mail app with the summary already written in. Just drag the downloaded report and audio files into that draft before hitting send.</p>
      <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin:14px 0;">
        <input type="email" id="teacherEmail" placeholder="teacher@example.com" style="flex:1; min-width:220px; padding:11px 14px; border:1px solid var(--line); border-radius:9px; background:var(--panel); color:var(--ink); font-family:'IBM Plex Sans',sans-serif; font-size:14px;">
        <button class="btn-primary" id="emailResultsBtn">✉ Download &amp; Draft Email</button>
      </div>
      <p class="mini" id="emailNote"></p>
    </div>
  `;
  app.innerHTML=''; app.appendChild(c);

  function buildReportText(){
    const lines = [];
    lines.push('TOEFL iBT 2026 — Full Mock Test Report');
    lines.push('Generated: ' + new Date().toString());
    lines.push('');
    lines.push('=== READING ===');
    lines.push(`Module 1 score: ${state.readingM1Score}/${state.readingM1Total} (${readingPct}%)`);
    lines.push(`Module 2 assigned: ${state.readingBranch==='hard'?'Higher Level':'Standard Level'}`);
    lines.push('');
    lines.push('=== LISTENING ===');
    lines.push(`Module 1 score: ${state.listeningM1Score}/${state.listeningM1Total} (${listeningPct}%)`);
    lines.push(`Module 2 assigned: ${state.listeningBranch==='hard'?'Higher Level':'Standard Level'}`);
    lines.push('');
    lines.push('=== SPEAKING ===');
    lines.push(`Recordings captured: ${recCount} (Listen and Repeat: up to 7, Interview: up to 4)`);
    lines.push('(Audio files saved separately — see recordings download)');
    lines.push('');
    lines.push('=== WRITING ===');
    lines.push('--- Build a Sentence ---');
    lines.push((state.sentenceOrder||[]).map(i=>CONTENT.writing.buildSentence.chips[i]).join(' '));
    lines.push('');
    lines.push('--- Email ---');
    lines.push(state.answers.emailText || '(no response entered)');
    lines.push('');
    lines.push('--- Academic Discussion ---');
    lines.push(state.answers.discText || '(no response entered)');
    return lines.join('\n');
  }

  async function downloadReport(){ await saveFile('TOEFL_2026_MockTest_Report.txt', buildReportText(), 'text/plain'); }
  async function downloadRecordings(){
    const keys = Object.keys(state.recordings);
    for(const k of keys){
      await saveFile(`TOEFL_2026_speaking_${k}.webm`, state.recordings[k], 'audio/webm');
    }
    return keys.length;
  }

  document.getElementById('dlReportBtn').onclick = downloadReport;

  document.getElementById('dlRecordingsBtn').onclick = async ()=>{
    const n = await downloadRecordings();
    if(n===0) alert('No recordings were captured this session.');
  };

  document.getElementById('emailResultsBtn').onclick = async ()=>{
    const emailInput = document.getElementById('teacherEmail');
    const note = document.getElementById('emailNote');
    const to = emailInput.value.trim();
    if(!to || !to.includes('@')){
      note.textContent = 'Enter a valid email address first.';
      note.style.color = 'var(--bad)';
      return;
    }
    note.style.color = 'var(--sub)';
    note.textContent = 'Downloading report and recordings…';
    await downloadReport();
    const n = await downloadRecordings();

    const subject = 'TOEFL iBT 2026 Mock Test Results';
    let body = buildReportText();
    // mailto bodies are limited (~1800 chars is a safe cross-client ceiling) — truncate and point to the attachments.
    const limit = 1500;
    if(body.length > limit){
      body = body.slice(0, limit) + '\n\n[Report truncated in email — see the attached TOEFL_2026_MockTest_Report.txt for the full text.]';
    }
    body += `\n\n(${n} audio recording${n===1?'':'s'} downloaded separately — attach the .webm file${n===1?'':'s'} from your downloads before sending.)`;

    const mailto = `mailto:${encodeURIComponent(to)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
    window.location.href = mailto;

    note.style.color = 'var(--good)';
    note.textContent = `Downloaded the report and ${n} recording${n===1?'':'s'} — your email app should now open a draft to ${to}. Attach the downloaded files before sending.`;
  };

  document.getElementById('restartBtn').onclick = ()=>{
    Object.keys(state).forEach(k=>{
      if(!['timerId'].includes(k)) delete state[k];
    });
    Object.assign(state, {step:'welcome', idx:0, answers:{}, readingM1Score:0, readingM1Total:0, listeningM1Score:0, listeningM1Total:0, readingBranch:null, listeningBranch:null, timeLeft:0, audioPlayed:{}, recordings:{}, sequence:[]});
    renderWelcome();
  };
}

/* ============================= NAV ============================= */
prevBtn.onclick = ()=>{
  if(state.idx>0){ stopSpeaking(); stopRecording(); state.idx--; renderStep(); }
};
nextBtn.onclick = ()=>{ goNext(); };
function goNext(){
  stopSpeaking(); stopRecording();
  if(state.idx < state.sequence.length-1){ state.idx++; renderStep(); }
}

/* ============================= INIT ============================= */
renderWelcome();
</script>
</body>
</html>
